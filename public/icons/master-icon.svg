<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Cream backdrop with rounded corners (neo-brutalist) -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#FDEBD3"/>

  <!-- Green tile with black border -->
  <rect x="40" y="40" width="432" height="432" rx="72" fill="#00D09C" stroke="#111" stroke-width="14"/>

  <!-- "Gen-Z" small badge -->
  <rect x="64" y="74" width="170" height="46" rx="14" fill="#111"/>
  <text x="149" y="106" font-family="Inter, system-ui, sans-serif"
        font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">Gen-Z</text>

  <!-- "IITian" wordmark -->
  <text x="256" y="290" font-family="Inter, system-ui, sans-serif"
        font-size="180" font-weight="900" fill="#FFFFFF" text-anchor="middle"
        letter-spacing="-8">IITian</text>

  <!-- Coral underline accent -->
  <rect x="80" y="340" width="352" height="14" rx="7" fill="#FF6B6B"/>

  <!-- "Connect" subtitle -->
  <text x="256" y="420" font-family="Inter, system-ui, sans-serif"
        font-size="68" font-weight="800" fill="#111" text-anchor="middle"
        letter-spacing="2">CONNECT</text>
</svg>
